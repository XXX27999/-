# === 2026-09-15 卡顿优化（原配置见 D:\CodexBackup\20260915_perf\config.toml.bak-20260915-perf）===
# 1) 带 tools 实测 19 个模型：18 个走供应商「白」(apihub.veletis.com) 全部 502；
#    deepseek-v4-flash 回报 tools_not_supported（渠道不接受工具调用），Codex 每轮必带 tools 故不可用。
#    当前唯一「接受工具调用 + 上游健康」的模型是 gemini-3.1-flash-lite（3236 ms 通过）。
#    供应商「白」恢复后应换回 gemini-3.5-flash。
# 2) 推理档位 xhigh -> medium（xhigh 每轮推理 token 成倍膨胀）
# 3) 自动压缩阈值 900000 -> 150000（避免 prefill 到 90 万 token 才触发、且压缩摘要极长）
